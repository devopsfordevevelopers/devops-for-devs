apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-app
  labels:
    app: react-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-app
  template:
    metadata:
      labels:
        app: react-app
    spec:
      containers:
        - name: react-app
          image: docker.io/devopsfordevelopers/devops-for-devs:react-app-1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
