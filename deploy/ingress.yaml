apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: java-app-ingress
spec:
  rules:
    - host: java-app.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: java-app-service
                port:
                  number: 80
# add entry of ip addres -> host
# minikube ip
# sudo vim /etc/hosts
# example:
# 192.168.49.2   java-app.com
